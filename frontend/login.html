<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Air Quality Dashboard</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-shell">

  <!-- LEFT: atmosphere -->
  <div class="atmosphere">
    <canvas id="particleCanvas"></canvas>

    <div class="atmosphere-content">
      <div class="brand"><span class="dot"></span> AIR QUALITY DASHBOARD</div>
      <h1 class="headline">Know your air<br><span>before you breathe it.</span></h1>
      <p class="subline">Real-time AQI, pollutant breakdowns, and forecasts for any city, in one place.</p>

      <div class="live-pill">
        <span class="swatch" id="liveSwatch"></span>
        Live sample · AQI <b id="liveAqiValue">42</b> · <span id="liveAqiLabel">Good</span>
      </div>
    </div>

    <div class="atmosphere-foot">SECURE CONNECTION · SESSION ENCRYPTED</div>
  </div>

  <!-- RIGHT: form -->
  <div class="form-side">
    <div class="form-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to see today's air quality.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
      </form>

      <div class="switch-line">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

</div>

<script src="auth.js"></script>
</body>
</html>
